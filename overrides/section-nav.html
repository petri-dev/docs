<aside class="petri-section-sidebar">
    <nav class="petri-section-nav navbar-expand-lg" aria-label="{{ section.title }} chapters">
        <button type="button" class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#section-navigation" aria-controls="section-navigation" aria-expanded="false">
            <span class="fa fa-bars" aria-hidden="true"></span> Chapters
        </button>
        <div id="section-navigation" class="navbar-collapse collapse">
            <span class="petri-section-title">{{ section.title }}</span>
            <ul class="petri-chapters">
                {% for item in section.children recursive %}
                <li>
                    {% if item.children %}
                    <details open>
                        <summary>{{ item.title }}</summary>
                        <ul>{{ loop(item.children) }}</ul>
                    </details>
                    {% else %}
                    <a href="{{ item.url | url }}"{% if item.active %} aria-current="page"{% endif %}>{{ item.title }}</a>
                    {% endif %}
                </li>
                {% endfor %}
            </ul>
        </div>
    </nav>
</aside>
